{% extends "auctions/layout.html" %}

{% block body %}
<h2>Listings in "{{ category_name }}"</h2>

{% if listings %}
    <ul class="list-group">
        {% for listing in listings %}
            <li class="list-group-item">
                <a href="{% url 'listing' listing.id %}">
                    {{ listing.title }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No listings in this category.</p>
{% endif %}

{% endblock %}
